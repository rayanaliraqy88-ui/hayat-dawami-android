name: Build Hayat Dawami APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'hayat-dawami-android-project.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q hayat-dawami-android-project.zip -d appsrc

      - name: Build APK
        working-directory: appsrc
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayat-dawami-apk
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
